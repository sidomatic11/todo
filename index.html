<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>today</title>
  <meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: ui-monospace, 'SF Mono', 'Fira Mono', 'Cascadia Code', monospace;
      background: #f3f2ee;
      color: #181816;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1.25rem 4rem;
    }

    #app {
      width: 100%;
      max-width: 440px;
    }

    /* Watermark wordmark — present but not competing */
    h1 {
      font-size: 0.6rem;
      font-weight: normal;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #ccc9c0;
      margin-bottom: 2.5rem;
    }

    /* ── Auth ── */
    #auth-section,
    #todo-section {
      display: none;
    }

    #auth-section.active,
    #todo-section.active {
      display: block;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #b8b5ac;
      display: block;
      margin-bottom: 0.5rem;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      border: none;
      border-bottom: 1px solid #dddad4;
      background: transparent;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.4rem 0 0.5rem;
      outline: none;
      color: #181816;
      transition: border-color 0.15s;
    }

    input:focus {
      border-bottom-color: #181816;
    }

    input::placeholder {
      color: #ccc9c0;
    }

    button {
      font-family: inherit;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: #181816;
      color: #f3f2ee;
      border: none;
      padding: 0.65rem 1.4rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.15s;
    }

    button:hover {
      opacity: 0.72;
    }

    button.ghost {
      background: transparent;
      color: #b8b5ac;
      border: 1px solid #dddad4;
      padding: 0.28rem 0.65rem;
      margin-top: 0;
      font-size: 0.6rem;
    }

    button.ghost:hover {
      color: #181816;
      border-color: #b8b5ac;
      opacity: 1;
    }

    #msg {
      font-size: 0.75rem;
      color: #b8b5ac;
      margin-top: 0.75rem;
      min-height: 1.1em;
    }

    #logout-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: #d4d1c8;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0;
      margin: 0;
      line-height: 1;
      transition: color 0.15s;
      z-index: 10;
    }

    #logout-btn:hover {
      color: #181816;
      opacity: 1;
    }

    /* ── Add row ── */
    #add-row {
      display: flex;
      align-items: flex-end;
      gap: 0.75rem;
      margin-bottom: 2.75rem;
    }

    #add-row input {
      flex: 1;
    }

    /* Quiet "+" — border only, no fill */
    #add-btn {
      flex-shrink: 0;
      background: transparent;
      color: #181816;
      border: 1px solid #dddad4;
      padding: 0.38rem 0.7rem 0.42rem;
      font-size: 1rem;
      letter-spacing: 0;
      line-height: 1;
      margin-top: 0;
      transition: border-color 0.15s, opacity 0.15s;
    }

    #add-btn:hover {
      border-color: #181816;
      opacity: 1;
    }

    /* ── Sections ── */
    #today-section {
      margin-bottom: 3rem;
    }

    .section-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }

    .label-text {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* Today label — full presence */
    #today-section .label-text {
      color: #181816;
    }

    /* Not Today label — receded */
    #not-today-section .label-text {
      color: #c8c5bc;
    }

    /* Slot dots — capacity at a glance */
    #today-slots {
      font-size: 0.5rem;
      letter-spacing: 0.3em;
      color: #c8c5bc;
      user-select: none;
    }

    /* ── Task lists ── */
    .task-list {
      list-style: none;
    }

    .task-list.drop-target {
      outline: 1px dashed #c8c5bc;
      outline-offset: 6px;
      border-radius: 1px;
    }

    /* Shared row layout */
    .task-list li {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      border-bottom: 1px solid #e8e6e1;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .task-list li:first-child {
      border-top: 1px solid #e8e6e1;
    }

    /* Today — primary stage: larger, more air */
    #today-list li {
      padding: 0.8rem 0;
      font-size: 0.95rem;
    }

    /* Not Today — backstage: smaller, muted, less air */
    #not-today-list li {
      padding: 0.55rem 0;
      font-size: 0.85rem;
      color: #a8a59c;
      border-color: #eceae5;
    }

    #not-today-list li:first-child {
      border-color: #eceae5;
    }

    .task-list li.dragging {
      opacity: 0.2;
    }

    /* Fade + drift right on completion */
    .task-list li.fading {
      opacity: 0;
      transform: translateX(10px);
      pointer-events: none;
    }

    /* Checkbox */
    .task-list li input[type="checkbox"] {
      width: 13px;
      height: 13px;
      accent-color: #181816;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-list li input[type="checkbox"]:disabled {
      cursor: default;
    }

    #not-today-list li input[type="checkbox"] {
      accent-color: #a8a59c;
    }

    .task-text {
      flex: 1;
      line-height: 1.4;
    }

    .task-list li.done .task-text {
      text-decoration: line-through;
      opacity: 0.3;
    }

    /* Icon buttons: ↑ ↓ × */
    .icon-btn {
      background: none;
      border: none;
      color: #c8c5bc;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0 2px;
      margin: 0;
      line-height: 1;
      text-transform: none;
      letter-spacing: 0;
      flex-shrink: 0;
      font-family: inherit;
      transition: color 0.12s, opacity 0.12s;
    }

    .icon-btn:hover {
      color: #181816;
      background: none;
    }

    .icon-btn:disabled {
      opacity: 0.18;
      cursor: default;
    }

    .icon-btn:disabled:hover {
      color: #c8c5bc;
    }

    /* On pointer devices: hide action buttons until the row is hovered.
       Reduces visual clutter — Gestalt law of proximity / figure-ground. */
    @media (hover: hover) {
      .task-list li .icon-btn {
        opacity: 0;
      }

      .task-list li:hover .icon-btn {
        opacity: 1;
      }

      .task-list li:hover .icon-btn:disabled {
        opacity: 0.18;
      }
    }

    /* ── Dark mode ── */
    @media (prefers-color-scheme: dark) {
      body {
        background: #111110;
        color: #e4e2dc;
      }

      h1 { color: #2e2e2a; }

      input[type="email"],
      input[type="password"],
      input[type="text"] {
        color: #e4e2dc;
        border-bottom-color: #2a2a27;
      }

      input:focus { border-bottom-color: #e4e2dc; }
      input::placeholder { color: #3a3a36; }

      button {
        background: #e4e2dc;
        color: #111110;
      }

      #logout-btn { color: #2e2e2a; }
      #logout-btn:hover { color: #e4e2dc; }

      #add-btn {
        background: transparent;
        color: #e4e2dc;
        border-color: #2a2a27;
      }

      #add-btn:hover {
        border-color: #e4e2dc;
      }

      #today-section .label-text { color: #e4e2dc; }
      #not-today-section .label-text { color: #302f2b; }
      #today-slots { color: #3a3a36; }

      .task-list li { border-color: #1e1e1b; }

      #not-today-list li {
        color: #4e4e48;
        border-color: #1a1a17;
      }

      #not-today-list li:first-child {
        border-color: #1a1a17;
      }

      .icon-btn { color: #3a3a36; }
      .icon-btn:hover { color: #e4e2dc; }

      .task-list.drop-target { outline-color: #3a3a36; }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="auth-section">
      <div class="field">
        <label for="email-input">email</label>
        <input type="email" id="email-input" placeholder="you@example.com" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password-input">password</label>
        <input type="password" id="password-input" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button id="login-btn">sign in</button>
      <p id="msg"></p>
    </div>

    <div id="todo-section">
      <button id="logout-btn" title="sign out">⏻</button>
      <div id="add-row">
        <input type="text" id="new-todo" placeholder="add to today…" />
        <button id="add-btn">+</button>
      </div>

      <div class="section" id="today-section">
        <div class="section-label">
          <span class="label-text">today</span>
          <span id="today-slots">○ ○ ○</span>
        </div>
        <ul id="today-list" class="task-list" data-section="today"></ul>
      </div>

      <div class="section" id="not-today-section">
        <div class="section-label">
          <span class="label-text">not today</span>
        </div>
        <ul id="not-today-list" class="task-list" data-section="not_today"></ul>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://iuxexaqephrslyyjbmoz.supabase.co"
    const SUPABASE_KEY = "sb_publishable_yGemzn6s4QO8mzM3iPrnJA_5umw2HyD"
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    let todayCount = 0
    let currentUserId = null

    const authSection = document.getElementById("auth-section")
    const todoSection = document.getElementById("todo-section")
    const emailInput = document.getElementById("email-input")
    const passwordInput = document.getElementById("password-input")
    const loginBtn = document.getElementById("login-btn")
    const msgEl = document.getElementById("msg")
    const newTodoInput = document.getElementById("new-todo")
    const addBtn = document.getElementById("add-btn")
    const logoutBtn = document.getElementById("logout-btn")
const todayList = document.getElementById("today-list")
    const notTodayList = document.getElementById("not-today-list")
    const todaySlotsEl = document.getElementById("today-slots")

    async function init() {
      sb.auth.onAuthStateChange((_e, session) => {
        if (session) showApp(session.user)
        else showAuth()
      })
      const { data: { session } } = await sb.auth.getSession()
      if (session) showApp(session.user)
      else showAuth()
    }

    function showAuth() {
      authSection.classList.add("active")
      todoSection.classList.remove("active")
    }

    async function showApp(user) {
      currentUserId = user.id
      authSection.classList.remove("active")
      todoSection.classList.add("active")
await checkDailyReset()
      await loadTodos()
    }

    async function signIn() {
      const email = emailInput.value.trim()
      const password = passwordInput.value
      if (!email || !password) return
      loginBtn.disabled = true
      msgEl.textContent = "…"
      const { error } = await sb.auth.signInWithPassword({ email, password })
      msgEl.textContent = error ? error.message : ""
      loginBtn.disabled = false
    }

    loginBtn.onclick = signIn
    passwordInput.onkeydown = e => { if (e.key === "Enter") signIn() }
    logoutBtn.onclick = () => sb.auth.signOut()

    async function checkDailyReset() {
      const today = new Date().toDateString()
      const key = `today_reset_${currentUserId}`
      if (localStorage.getItem(key) === today) return
      await Promise.all([
        sb.from("todos").update({ section: "not_today" }).eq("section", "today").eq("done", false),
        sb.from("todos").delete().eq("section", "today").eq("done", true)
      ])
      localStorage.setItem(key, today)
    }

    async function loadTodos() {
      const { data } = await sb.from("todos").select("*")
      todayList.innerHTML = ""
      notTodayList.innerHTML = ""
      todayCount = 0
      if (!data) return

      const todayItems = data
        .filter(t => t.section === "today")
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))

      const notTodayItems = data
        .filter(t => t.section !== "today")
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))

      todayItems.forEach(t => todayList.appendChild(makeItem(t)))
      notTodayItems.forEach(t => notTodayList.appendChild(makeItem(t)))
      todayCount = todayItems.length
      updateSlots()
    }

    function updateSlots() {
      // Slot dots: ● for used slots, ○ for open — capacity at a glance
      const dots = "●".repeat(todayCount) + "○".repeat(3 - todayCount)
      todaySlotsEl.textContent = dots.split("").join(" ")
      newTodoInput.placeholder = todayCount < 3 ? "add to today…" : "add to not today…"
      notTodayList.querySelectorAll(".move-btn").forEach(btn => {
        btn.disabled = todayCount >= 3
      })
    }

    function makeItem(todo) {
      const li = document.createElement("li")
      li.dataset.id = String(todo.id)
      li.dataset.section = todo.section || "not_today"
      li.draggable = true
      if (todo.done) li.classList.add("done")

      const cb = document.createElement("input")
      cb.type = "checkbox"
      cb.checked = todo.done

      const text = document.createElement("span")
      text.className = "task-text"
      text.textContent = todo.text

      const moveBtn = document.createElement("button")
      moveBtn.className = "icon-btn move-btn"
      const isToday = todo.section === "today"
      moveBtn.textContent = isToday ? "↓" : "↑"
      moveBtn.title = isToday ? "move to not today" : "move to today"
      if (!isToday) moveBtn.disabled = todayCount >= 3

      const delBtn = document.createElement("button")
      delBtn.className = "icon-btn"
      delBtn.textContent = "×"

      cb.onchange = () => completeItem(todo.id, li, cb)
      moveBtn.onclick = () => {
        const to = li.dataset.section === "today" ? "not_today" : "today"
        moveItem(todo.id, li, to)
      }
      delBtn.onclick = () => deleteItem(todo.id, li)

      li.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/id", String(todo.id))
        e.dataTransfer.setData("text/from", li.dataset.section)
        setTimeout(() => li.classList.add("dragging"), 0)
      })
      li.addEventListener("dragend", () => li.classList.remove("dragging"))

      li.append(cb, text, moveBtn, delBtn)
      return li
    }

    async function completeItem(id, li, cb) {
      cb.disabled = true
      li.classList.add("done")
      await sb.from("todos").update({ done: true }).eq("id", id)
      setTimeout(async () => {
        li.classList.add("fading")
        await delay(420)
        await sb.from("todos").delete().eq("id", id)
        if (li.dataset.section === "today") { todayCount--; updateSlots() }
        li.remove()
      }, 800)
    }

    async function moveItem(id, li, toSection) {
      if (toSection === "today" && todayCount >= 3) return
      await sb.from("todos").update({ section: toSection }).eq("id", id)

      li.dataset.section = toSection
      const moveBtn = li.querySelector(".move-btn")
      moveBtn.textContent = toSection === "today" ? "↓" : "↑"
      moveBtn.title = toSection === "today" ? "move to not today" : "move to today"
      moveBtn.disabled = false

      if (toSection === "today") {
        todayList.appendChild(li)
        todayCount++
      } else {
        notTodayList.prepend(li)
        todayCount--
      }
      updateSlots()
    }

    async function deleteItem(id, li) {
      await sb.from("todos").delete().eq("id", id)
      if (li.dataset.section === "today") { todayCount--; updateSlots() }
      li.remove()
    }

    async function addTodo() {
      const text = newTodoInput.value.trim()
      if (!text) return
      newTodoInput.value = ""
      const section = todayCount < 3 ? "today" : "not_today"
      const { data, error } = await sb.from("todos").insert({ text, section }).select().single()
      if (error || !data) return
      const li = makeItem(data)
      if (section === "today") {
        todayList.appendChild(li)
        todayCount++
        updateSlots()
      } else {
        notTodayList.prepend(li)
      }
    }

    function delay(ms) { return new Promise(r => setTimeout(r, ms)) }

    ;[todayList, notTodayList].forEach(list => {
      list.addEventListener("dragover", e => {
        e.preventDefault()
        if (list.dataset.section === "today" && todayCount >= 3) return
        list.classList.add("drop-target")
      })
      list.addEventListener("dragleave", e => {
        if (!list.contains(e.relatedTarget)) list.classList.remove("drop-target")
      })
      list.addEventListener("drop", e => {
        e.preventDefault()
        list.classList.remove("drop-target")
        const id = e.dataTransfer.getData("text/id")
        const fromSection = e.dataTransfer.getData("text/from")
        const toSection = list.dataset.section
        if (fromSection === toSection) return
        if (toSection === "today" && todayCount >= 3) return
        const li = document.querySelector(`[data-id="${id}"]`)
        if (li) moveItem(id, li, toSection)
      })
    })

    addBtn.onclick = addTodo
    newTodoInput.onkeydown = e => { if (e.key === "Enter") addTodo() }

    init()
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {})
      })
    }
  </script>
</body>

</html>
